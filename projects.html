<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Projects Manager</title>

<style>
body {
  font-family: Arial;
  background:#f2f2f2;
  padding:20px;
}

#container {
  display:flex;
  flex-direction:column;
  gap:10px;
}

.card {
  display:grid;
  grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr auto;
  gap:8px;
  background:white;
  padding:10px;
  border-radius:10px;
}

input {
  padding:5px;
}

.delete {
  cursor:pointer;
  color:red;
  font-weight:bold;
}

button {
  margin-top:15px;
  padding:10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.add { background:#4CAF50; color:white; }
.save { background:#1877f2; color:white; }
</style>
</head>

<body>

<h2>Projects Manager</h2>

<div id="container"></div>

<button class="add" onclick="addCard()">+ Add Project</button>
<button class="save" onclick="saveData()">SAVE</button>

<script>
const API_URL = "YOUR_WEB_APP_URL";
const container = document.getElementById("container");

/* LOAD */
function loadData() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      container.innerHTML = "";
      data.forEach(row => createCard(row));
    });
}

/* CREATE CARD */
function createCard(data = []) {
  const card = document.createElement("div");
  card.className = "card";

  card.innerHTML = `
    <input placeholder="Project Name" value="${data[1] || ""}">
    <input placeholder="Brand" value="${data[2] || ""}">
    <input placeholder="Project Head" value="${data[3] || ""}">
    <input type="date" value="${data[4] || ""}">
    <input type="date" value="${data[5] || ""}">
    <div class="delete">🗑</div>
  `;

  card.querySelector(".delete").onclick = () => {
    if(confirm("Delete project?")) card.remove();
  };

  container.appendChild(card);
}

/* ADD */
function addCard() {
  createCard();
}

/* SAVE */
function saveData() {
  const rows = [...document.querySelectorAll(".card")].map(card => {
    const inputs = card.querySelectorAll("input");

    return {
      name: inputs[0].value,
      brand: inputs[1].value,
      head: inputs[2].value,
      start: inputs[3].value,
      deadline: inputs[4].value
    };
  });

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(rows)
  })
  .then(res => res.json())
  .then(data => {
    if(data.status === "success") {
      alert("Saved!");
      loadData();
    } else {
      alert("Error: " + data.message);
    }
  });
}

/* INIT */
loadData();
</script>

</body>
</html>
