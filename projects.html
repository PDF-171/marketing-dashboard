<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxxaAX2ct3FWRAEuuo26IjzU8xnGxg722zgKc8qSAusRxVlahr2iqnPIew3Vmb_CNFZ/exec";

let projects = [];

const container = document.getElementById("container");
const search = document.getElementById("search");
const brandFilter = document.getElementById("brandFilter");
const headFilter = document.getElementById("headFilter");

/* LOAD */
function loadData() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {

      projects = data.map(row => ({
        project: row[1] || "",
        sub_department: row[2] || "",
        project_head: row[3] || "",
        brand: row[4] || "",
        date_started: row[5] || "",
        deadline: row[6] || "",
        remarks: row[7] || "",
        accomplishment_percentage: Number(row[8]) || 0,
        status: row[9] || ""
      }))
      .filter(p => p.project.trim() !== "");

      initFilters();
      render();
    });
}

/* FILTERS */
function initFilters() {
  const brands = [...new Set(projects.map(p => p.brand).filter(Boolean))];
  const heads = [...new Set(projects.map(p => p.project_head).filter(Boolean))];

  brandFilter.innerHTML = '<option value="">All Brands</option>';
  headFilter.innerHTML = '<option value="">All Project Heads</option>';

  brands.forEach(b => brandFilter.innerHTML += `<option>${b}</option>`);
  heads.forEach(h => headFilter.innerHTML += `<option>${h}</option>`);
}

/* COLOR */
function getColor(p) {
  if ((p.status || "").toLowerCase() === "done") return "#2ecc71";
  if ((p.status || "").toLowerCase() === "delayed") return "#e74c3c";

  if (p.accomplishment_percentage < 50) return "linear-gradient(90deg,#e74c3c,#f1c40f)";
  if (p.accomplishment_percentage < 100) return "linear-gradient(90deg,#f1c40f,#2ecc71)";
  return "#2ecc71";
}

/* RENDER */
function render() {
  container.innerHTML = "";

  const filtered = projects.filter(p =>
    (!brandFilter.value || p.brand === brandFilter.value) &&
    (!headFilter.value || p.project_head === headFilter.value) &&
    (p.project || "").toLowerCase().includes(search.value.toLowerCase())
  );

  filtered.forEach(p => {
    const index = projects.indexOf(p);

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="left" style="background:${getColor(p)}">
        <div style="width:100%">
          <input class="titleInput"
            value="${p.project}"
            onchange="projects[${index}].project=this.value">

          <div class="sub">${p.sub_department || ""}</div>
        </div>
      </div>

      <div class="middle">
        <input value="${p.brand}"
          onchange="projects[${index}].brand=this.value">

        <input value="${p.project_head}"
          onchange="projects[${index}].project_head=this.value">
      </div>

      <div class="right">
        <input type="number" min="0" max="100"
          value="${p.accomplishment_percentage}"
          onchange="projects[${index}].accomplishment_percentage=this.value">

        <div class="dates">
          <input type="date"
            value="${p.date_started}"
            onchange="projects[${index}].date_started=this.value">

          <input type="date"
            value="${p.deadline}"
            onchange="projects[${index}].deadline=this.value">
        </div>

        <div class="bottom">
          <input value="${p.status}"
            onchange="projects[${index}].status=this.value">

          <div class="delete" onclick="deleteProject(${index})">🗑</div>
        </div>
      </div>
    `;

    container.appendChild(card);
  });

  // ADD BUTTON
  const add = document.createElement("div");
  add.className = "add-btn";
  add.innerText = "+ Add New Project";
  add.onclick = addProject;
  container.appendChild(add);
}

/* ADD */
function addProject() {
  projects.push({
    project: "",
    sub_department: "",
    project_head: "",
    brand: "",
    date_started: "",
    deadline: "",
    remarks: "",
    accomplishment_percentage: 0,
    status: ""
  });

  render();
}

/* DELETE */
function deleteProject(i) {
  if (confirm("Delete project?")) {
    projects.splice(i, 1);
    render();
  }
}

/* SAVE */
function saveData() {
  const cleanData = projects
    .filter(p => p.project && p.project.trim() !== "")
    .map((p, i) => ({
      id: i + 1,
      project: p.project,
      sub_department: p.sub_department,
      project_head: p.project_head,
      brand: p.brand,
      date_started: p.date_started,
      deadline: p.deadline,
      remarks: p.remarks,
      accomplishment_percentage: Number(p.accomplishment_percentage),
      status: p.status
    }));

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(cleanData)
  })
  .then(res => res.json())
  .then(res => {
    if (res.status === "success") {
      alert("Saved successfully!");
      loadData();
    } else {
      alert("Save error: " + res.message);
    }
  })
  .catch(err => alert("Network error: " + err.message));
}

/* EVENTS */
search.oninput = render;
brandFilter.onchange = render;
headFilter.onchange = render;

/* INIT */
loadData();
</script>
