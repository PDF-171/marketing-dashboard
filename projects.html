<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Projects Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f2f2f2;
}

/* HEADER */
.header {
  position: sticky;
  top: 0;
  background: white;
  padding: 10px;
  display: flex;
  gap: 10px;
  align-items: center;
  z-index: 10;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.header input, .header select {
  padding: 6px;
}

.container {
  padding: 10px;
}

/* CARD */
.card {
  display: flex;
  height: 14vh;
  margin-bottom: 10px;
  border-radius: 10px;
  overflow: hidden;
  background: white;
}

/* LEFT */
.left {
  width: 50%;
  display: flex;
  align-items: center;
  padding: 15px;
  color: white;
}

.titleInput {
  font-size: 16px;
  font-weight: bold;
  border: none;
  background: transparent;
  color: white;
  width: 100%;
}

.sub {
  font-size: 12px;
  opacity: 0.8;
}

/* MIDDLE */
.middle {
  width: 25%;
  display: flex;
  flex-direction: column;
}

.middle input {
  height: 50%;
  border: none;
  padding: 8px;
  border-bottom: 1px solid #ddd;
}

/* RIGHT */
.right {
  width: 25%;
  display: flex;
  flex-direction: column;
}

.right input {
  border: none;
  padding: 6px;
  border-bottom: 1px solid #ddd;
}

/* dates */
.dates {
  display: flex;
}

.dates input {
  width: 50%;
}

/* bottom */
.bottom {
  display: flex;
}

.bottom input {
  width: 70%;
}

.delete {
  width: 30%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: red;
  cursor: pointer;
  font-weight: bold;
}

/* ADD BUTTON */
.add-btn {
  background: white;
  border: 2px dashed #999;
  padding: 15px;
  text-align: center;
  cursor: pointer;
  border-radius: 10px;
  margin-top: 10px;
}

/* FLOATING BUTTONS */
.scrollTop {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: black;
  color: white;
  padding: 10px;
  border-radius: 50%;
  cursor: pointer;
}

.saveFloating {
  position: fixed;
  bottom: 70px;
  right: 20px;
  background: #1877f2;
  color: white;
  padding: 10px 14px;
  border-radius: 20px;
  cursor: pointer;
  font-weight: bold;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <input type="text" id="search" placeholder="Search project...">

  <select id="brandFilter">
    <option value="">All Brands</option>
  </select>

  <select id="headFilter">
    <option value="">All Project Heads</option>
  </select>
</div>

<!-- CONTENT -->
<div class="container" id="container"></div>

<!-- FLOATING BUTTONS -->
<div class="scrollTop" onclick="window.scrollTo({top:0, behavior:'smooth'})">⬆</div>
<div class="saveFloating" onclick="saveData()">SAVE</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxxaAX2ct3FWRAEuuo26IjzU8xnGxg722zgKc8qSAusRxVlahr2iqnPIew3Vmb_CNFZ/exec";
let projects = [];

const container = document.getElementById("container");

/* LOAD */
function loadData() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {

      projects = data.map(row => ({
        project: row[1] || "",
        sub_department: row[2] || "",
        project_head: row[3] || "",
        brand: row[4] || "",
        date_started: row[5] || "",
        deadline: row[6] || "",
        remarks: row[7] || "",
        accomplishment_percentage: Number(row[8]) || 0,
        status: row[9] || ""
      }))
      .filter(p => p.project.trim() !== ""); // hide empty rows

      initFilters();
      render();
    });
}

/* FILTERS */
function initFilters() {
  const brands = [...new Set(projects.map(p => p.brand).filter(Boolean))];
  const heads = [...new Set(projects.map(p => p.project_head).filter(Boolean))];

  brandFilter.innerHTML = '<option value="">All Brands</option>';
  headFilter.innerHTML = '<option value="">All Project Heads</option>';

  brands.forEach(b => brandFilter.innerHTML += `<option>${b}</option>`);
  heads.forEach(h => headFilter.innerHTML += `<option>${h}</option>`);
}

/* COLOR */
function getColor(p) {
  if ((p.status || "").toLowerCase() === "done") return "#2ecc71";
  if ((p.status || "").toLowerCase() === "delayed") return "#e74c3c";

  if (p.accomplishment_percentage < 50) return "linear-gradient(90deg,#e74c3c,#f1c40f)";
  if (p.accomplishment_percentage < 100) return "linear-gradient(90deg,#f1c40f,#2ecc71)";
  return "#2ecc71";
}

/* RENDER */
function render() {
  container.innerHTML = "";

  const filtered = projects.filter(p =>
    (!brandFilter.value || p.brand === brandFilter.value) &&
    (!headFilter.value || p.project_head === headFilter.value) &&
    (p.project || "").toLowerCase().includes(search.value.toLowerCase())
  );

  filtered.forEach((p, i) => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="left" style="background:${getColor(p)}">
        <div style="width:100%">
          <!-- EDITABLE PROJECT NAME -->
          <input class="titleInput"
            value="${p.project}"
            onchange="projects[${i}].project=this.value">

          <div class="sub">${p.sub_department || ""}</div>
        </div>
      </div>

      <div class="middle">
        <input value="${p.brand}"
          onchange="projects[${i}].brand=this.value">

        <input value="${p.project_head}"
          onchange="projects[${i}].project_head=this.value">
      </div>

      <div class="right">
        <input type="number" min="0" max="100"
          value="${p.accomplishment_percentage}"
          onchange="projects[${i}].accomplishment_percentage=this.value">

        <div class="dates">
          <input type="date"
            value="${p.date_started}"
            onchange="projects[${i}].date_started=this.value">

          <input type="date"
            value="${p.deadline}"
            onchange="projects[${i}].deadline=this.value">
        </div>

        <div class="bottom">
          <input value="${p.status}"
            onchange="projects[${i}].status=this.value">

          <div class="delete" onclick="deleteProject(${i})">🗑</div>
        </div>
      </div>
    `;

    container.appendChild(card);
  });

  // ADD NEW PROJECT BUTTON
  const add = document.createElement("div");
  add.className = "add-btn";
  add.innerText = "+ Add New Project";
  add.onclick = addProject;
  container.appendChild(add);
}

/* ADD */
function addProject() {
  projects.push({
    project: "",
    sub_department: "",
    project_head: "",
    brand: "",
    date_started: "",
    deadline: "",
    remarks: "",
    accomplishment_percentage: 0,
    status: ""
  });

  render();
}

/* DELETE */
function deleteProject(i) {
  if (confirm("Delete project?")) {
    projects.splice(i, 1);
    render();
  }
}

/* SAFE SAVE */
function saveData() {
  const cleanData = projects
    .filter(p => p.project && p.project.trim() !== "")
    .map((p, i) => ([
      i + 1,
      p.project,
      p.sub_department,
      p.project_head,
      p.brand,
      p.date_started,
      p.deadline,
      p.remarks,
      Number(p.accomplishment_percentage),
      p.status
    ]));

  fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(cleanData)
  })
  .then(res => res.json())
  .then(res => {
    if (res.status === "success") {
      alert("Saved successfully!");
      loadData();
    } else {
      alert("Save error: " + res.message);
    }
  })
  .catch(err => alert("Network error: " + err.message));
}

/* EVENTS */
search.oninput = render;
brandFilter.onchange = render;
headFilter.onchange = render;

/* INIT */
loadData();
</script>

</body>
</html>
